<!-- Nguồn ảnh xem trước docs/og.png (1200x630). Xuất lại:
     google-chrome --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=6000 --screenshot=docs/og.png "file://$PWD/scripts/og.html" -->
<!doctype html><html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@200;300;400;600;700&family=Dancing+Script:wght@600;700&family=Patrick+Hand&display=block&subset=vietnamese">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:'Be Vietnam Pro',sans-serif;color:#2e2e33;background:radial-gradient(120% 90% at 30% 0%,#2a5fb8 0%,#1d4c9c 45%,#12346f 100%);position:relative}
.paper{position:absolute;left:70px;top:78px;width:1060px;height:500px;background:#fffefa;border-radius:6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);display:grid;grid-template-columns:1fr 430px;padding:46px 54px 40px}
.paper::before{content:"";position:absolute;left:24px;right:24px;top:-22px;height:42px;
 background:radial-gradient(circle at 50% 80%,#12346f 0 4.5px,transparent 5px),linear-gradient(90deg,transparent 6px,#d9dde4 6px 9px,#9aa1ad 9px 10.5px,transparent 10.5px);background-size:22px 42px,22px 30px;background-repeat:repeat-x}
.left{display:flex;flex-direction:column;justify-content:center;padding-right:30px;border-right:2px solid #e4e0d6}
.kicker{font-size:22px;font-weight:700;letter-spacing:.18em;color:#c8102e}
h1{margin:6px 0 0;font-family:'Dancing Script',cursive;font-weight:700;font-size:118px;line-height:1;color:#659a35}
.sub{margin-top:22px;font-size:30px;font-weight:400;line-height:1.35;color:#2e2e33}
.tags{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
.tags span{font-size:21px;font-weight:600;padding:7px 16px;border-radius:22px;background:#9b4f96;color:#fff}
.tags span:nth-child(2){background:#c8102e}.tags span:nth-child(3){background:#2f6db5}
.right{padding-left:40px;display:flex;flex-direction:column;justify-content:center}
.mhead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid #c8102e;padding-bottom:8px;margin-bottom:8px}
.mhead b{font-family:'Dancing Script',cursive;font-size:44px;color:#659a35;font-weight:700}
.mhead i{font-style:normal;font-size:22px;font-weight:200;color:#c8102e}
.g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:4px}
.g .h{font-size:15px;font-weight:700;padding-bottom:4px}.g .h.s{color:#c8102e}
.d{position:relative;font-size:24px;font-weight:300;line-height:1;padding:7px 0 3px}
.d small{display:block;font-size:11px;opacity:.6;margin-top:2px}
.d.s{color:#c8102e}.d.o{color:#bbb}.d.t .n{background:linear-gradient(transparent 55%,#ffe27a 55% 92%,transparent 92%);padding:0 3px}
.d svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);width:52px;height:44px;overflow:visible}
.note{font-family:'Patrick Hand',cursive;font-size:13px;line-height:1;transform:rotate(-3deg);white-space:nowrap}
</style></head><body>
<div class="paper">
 <div class="left">
  <div class="kicker">LỊCH ĐỂ BÀN</div>
  <h1>Lịch Bàn</h1>
  <div class="sub">Âm lịch, ngày lễ và ghi chú<br>khoanh tròn bằng nét bút.</div>
  <div class="tags"><span>Âm lịch</span><span>Ngày lễ</span><span>Nhắc qua Telegram</span></div>
 </div>
 <div class="right">
  <div class="mhead"><b>Tháng Mười</b><i>2026 · Bính Ngọ</i></div>
  <div class="g" id="g"></div>
 </div>
</div>
<script>
const g=document.getElementById('g');
['T2','T3','T4','T5','T6','T7','CN'].forEach((d,i)=>g.insertAdjacentHTML('beforeend',`<div class="h ${i==6?'s':''}">${d}</div>`));
const lunar=d=>d<10?d+20:(d==10?'1/9':d-9); // âm lịch thật tháng 10/2026
const circ=(c)=>`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M18,30 C30,6 80,4 92,30 C102,58 80,92 46,92 C14,92 2,64 10,40 C16,24 36,12 58,12" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/></svg>`;
const marks={10:'#c8102e',20:'#8a3f9b',28:'#1f5fbf'};
const notes={10:['Giỗ ông','#c8102e'],20:['Sinh nhật','#8a3f9b'],28:['Đi chơi','#1f5fbf']};
let cells=[];for(const d of [28,29,30])cells.push({d,o:1});for(let d=1;d<=31;d++)cells.push({d});cells.push({d:1,o:1});
cells.forEach((c,i)=>{const s=i%7==6;const t=c.d==13&&!c.o;
 g.insertAdjacentHTML('beforeend',`<div class="d ${s?'s':''} ${c.o?'o':''} ${t?'t':''}">${!c.o&&marks[c.d]?circ(marks[c.d]):''}<span class="n">${c.d}</span><small>${c.o?'':lunar(c.d)}</small></div>`)});
</script></body></html>
