<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lịch Bàn</title>
  <meta name="description" content="Lịch để bàn có âm lịch, ghi chú theo ngày và nhắc nhở qua Telegram.">
  <meta name="theme-color" content="#1d4c9c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lịch Bàn">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@200;300;400;600;700&family=Dancing+Script:wght@600&family=Patrick+Hand&display=swap&subset=vietnamese">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="page" class="paper">
    <header id="header" class="head"></header>
    <div id="grid" class="grid" role="grid" aria-label="Lịch tháng"></div>
    <aside id="aside" class="aside"></aside>
  </main>

  <dialog id="dayDialog" aria-label="Chi tiết ngày"></dialog>
  <dialog id="settingsDialog" aria-label="Cài đặt"></dialog>
  <dialog id="passwordDialog" aria-label="Nhập mật khẩu"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Code dùng chung với Apps Script (script thường, khai báo biến toàn cục) -->
  <script src="js/shared/lunar.js"></script>
  <script src="js/shared/canchi.js"></script>
  <script src="js/shared/holidays.js"></script>
  <script src="js/shared/monthGrid.js"></script>
  <script src="js/shared/occurrence.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
